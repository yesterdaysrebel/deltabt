[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltabt"
version = "0.1.0"
description = "Backtesting and pre-registered strategy research for Delta Exchange India perpetual futures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "requests>=2.28",
    "numba>=0.58",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "matplotlib>=3.7",
    # starlette's TestClient dropped its httpx fallback and now REQUIRES
    # httpx2. Unpinned, a developer machine keeps whatever it installed months
    # ago and passes, while a clean CI install takes the current starlette and
    # fails at import. The API tests are the only consumer.
    "httpx2",
]
#: The V1 live paper-trading bot. Note what is NOT here: no exchange SDK, no
#: signing library, no credential store. V1 reads public market data only.
live = [
    "websockets>=12.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "asyncpg>=0.29",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.scripts]
deltabt = "deltabt.cli:main"

[tool.setuptools.packages.find]
include = ["deltabt*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "strict"
markers = [
    "postgres: needs a live PostgreSQL (set DELTABOT_TEST_DSN)",
]
