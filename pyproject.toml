[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltabt"
version = "0.1.0"
description = "Backtesting and pre-registered strategy research for Delta Exchange India perpetual futures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "requests>=2.28",
    "numba>=0.58",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[project.scripts]
deltabt = "deltabt.cli:main"

[tool.setuptools.packages.find]
include = ["deltabt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
