name: m3-backtest

# TEMPORARY, RESEARCH ONLY, AND DELETED WHEN THE ANSWER IS IN HAND.
#
# Runs scripts/m3_backtest.py -- the measurement of the live cell on
# BEATUSD/ETHUSD/SOLUSD asked for on 2026-09-13 -- on a hosted runner,
# because the machine driving this branch has no route to the exchange API
# and the 1m archive is deliberately not in version control.
#
# It holds NO credentials and requests none: the data layer is the same
# GET-only public client the backtester has always used, and the job's
# token is read-only. It deploys nothing, touches no AWS resource, and the
# running experiment cannot see it.
#
# Triggered by pushes to the research branch only. It must NOT survive onto
# master: workflow_dispatch is deliberately absent so it cannot be pointed
# at anything later, and the branch filter makes it inert everywhere else.

on:
  push:
    branches:
      - claude/deltabt-running-arm-review-d2xqd7
    paths:
      - scripts/m3_backtest.py
      - scripts/m3_backfill.py
      - .github/workflows/m3-backtest.yml

permissions:
  contents: read

concurrency:
  group: m3-backtest
  cancel-in-progress: true

jobs:
  measure:
    name: "backtest: manual_scalp_both_t3 on ETH/SOL/BEAT"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        run: pip install -e .

      # The archive is rebuilt from the public API on every run. ~1,000
      # paginated requests through the client's own rate limiter; the cache
      # written here dies with the runner, which is fine -- the durable
      # output is the report, not the bars.
      - name: backfill the 1m archive
        run: PYTHONPATH=. python3 scripts/m3_backfill.py

      - name: run the measurement
        run: |
          set -o pipefail
          PYTHONPATH=. python3 scripts/m3_backtest.py | tee m3_report.txt
          {
            echo '```'
            cat m3_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: m3-backtest-${{ github.run_id }}
          path: m3_report.txt
          retention-days: 90
