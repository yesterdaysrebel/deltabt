name: infrastructure

# LIFECYCLE STAGE 2 of 3: INFRASTRUCTURE.
#
#   1. BOOTSTRAP    manual, once, from a workstation -- scripts/bootstrap.sh.
#                   Deliberately NOT a workflow: anything that can create its
#                   own trust anchor can also replace it.
#   2. INFRASTRUCTURE  <-- this file. Terraform owns AWS.
#   3. APPLICATION  deploy.yml. Image and container only; it cannot change
#                   infrastructure, and its role has no permission to.
#
#   The EXPERIMENT is a fourth thing and is deliberately not automated at all.
#   Nothing in this file, or any other, starts paper trading.
#
# TWO PATHS, AND THE DIFFERENCE IS THE POINT:
#
#   pull request  -> READ-ONLY. A separate role with ReadOnlyAccess. Plan and
#                    guards run; no mutation is possible even if the workflow
#                    is wrong, because the credentials cannot mutate.
#   push to master -> plan, guards, then a REQUIRED HUMAN APPROVAL on the
#                    protected `paper` environment, then apply of the exact
#                    plan file that was reviewed.
#
# A pull request can never apply. Not by convention -- by IAM.
#
# There are no AWS access keys anywhere in this file. The job exchanges its
# GitHub OIDC token for a short-lived role session; there is no long-lived
# credential to leak, rotate, or forget.

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infrastructure.yml", "deploy/aws/**"]
  push:
    branches: [master]
    paths: ["infra/**", ".github/workflows/infrastructure.yml", "deploy/aws/**"]
  workflow_dispatch:
    inputs:
      allow_replace:
        description: >-
          Permit this apply to REPLACE a protected resource (an EC2 host, its
          EIP, a log group). Off for every push; only a deliberate dispatch can
          turn it on, and the plan still has to be approved afterwards.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write        # required to mint the OIDC token
  pull-requests: write   # to post the plan

concurrency:
  # Two applies against one state file corrupt it. Never cancel in progress:
  # a half-applied, cancelled Terraform run is worse than a queued one.
  group: terraform-paper
  cancel-in-progress: false

env:
  TF_VERSION: "1.11.11"   # OpenTofu -- see the note on setup-opentofu below
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  # WHERE ALARMS ACTUALLY GO. Empty disables SNS, and empty is what it was:
  # all 24 CloudWatch alarms evaluated correctly and notified nobody, because
  # alarm_actions is `var.alarm_email != "" ? [topic] : []`. The only path from
  # an alarm to a human ran through the daily report, and the daily report runs
  # on GitHub's `schedule` trigger, which is best-effort -- it fired once in
  # three days, 80 minutes late, and skipped 2026-08-27 entirely. One
  # unreliable link, and it was the only link.
  #
  # Passed as TF_VAR_ rather than a default in variables.tf so the address is
  # not committed. Terraform reads TF_VAR_* automatically; an unset repository
  # variable yields "", which is the same as before.
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}

jobs:
  safety:
    name: safety boundary
    # The infrastructure path runs the boundary tests too. A Terraform change
    # can introduce a credential, open a port, or make a tag mutable, and none
    # of that is visible to a plan review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,live]"
      - name: paper-only boundary, shipped source and deployment surface
        run: |
          pytest tests/live/test_no_live_trading.py \
                 tests/live/test_deployment_safety.py \
                 tests/live/test_deployment_negative_controls.py -q

  plan:
    name: plan
    needs: safety
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # A pull request gets the READ-ONLY plan role. Only master and the
          # protected environment get the role that can change anything.
          role-to-assume: ${{ github.event_name == 'pull_request' && vars.AWS_TERRAFORM_PLAN_ROLE_ARN || vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      # OpenTofu, not Terraform. The remote state was written by OpenTofu
      # 1.11.11 on 2026-08-19, which records provider addresses under
      # registry.opentofu.org. Terraform 1.10.5 cannot read that state --
      # `terraform show -json` fails with 'unsupported attribute "vpc"' --
      # so CI follows the state rather than the state being rewritten to
      # follow CI. OpenTofu is a drop-in fork; the commands are identical.
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}
          # The wrapper shims the binary and writes its own `exitcode` step
          # output. The apply gate reads -detailed-exitcode, so two writers of
          # the same key is exactly the ambiguity to remove: the first run with
          # a real 41-resource plan produced a correct plan and then skipped
          # apply, because the gate never saw a 2.
          #
          # THE KEY IS `tofu_wrapper`, NOT `terraform_wrapper`. Converting this
          # file from hashicorp/setup-terraform to opentofu/setup-opentofu on
          # 2026-08-19 kept the old spelling, and an unknown input to a GitHub
          # action is a WARNING, not an error -- so the setting was silently
          # dropped, the wrapper stayed on, and the bug above came straight
          # back. A two-line plan with real changes reported exitcode 0 and
          # apply skipped itself. See the cross-check in the plan step, which
          # exists because this failure mode is invisible.
          tofu_wrapper: false

      - name: init
        working-directory: infra/terraform
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: fmt
        working-directory: infra/terraform
        run: tofu fmt -check -recursive

      - name: validate
        working-directory: infra/terraform
        run: tofu validate

      - name: AWS preflight -- trust anchors and backend
        # Fails closed. "Resource missing" is never read as "safe to create"
        # unless a plan actually creates it, which is why the plan is passed in
        # below rather than this being a bare existence check.
        run: |
          python3 scripts/aws_preflight.py --phase infrastructure \
            --region "$AWS_REGION" \
            --account "${{ vars.AWS_ACCOUNT_ID }}" \
            --state-bucket "${{ vars.TF_STATE_BUCKET }}"

      - name: refuse to proceed if AWS holds unmanaged or duplicate deltabt resources
        working-directory: infra/terraform
        # Runs BEFORE the plan. Terraform would eventually collide on the fixed
        # names and error mid-apply; this says what to import, and it also
        # catches a second running instance, which Terraform cannot see at all.
        run: |
          tofu show -json > state.json
          python3 ../../scripts/aws_unmanaged_check.py state.json \
            --environment paper --region "$AWS_REGION"

      - name: plan
        id: plan
        working-directory: infra/terraform
        # -detailed-exitcode: 0 no changes, 2 changes, 1 error. It is what lets
        # the apply job skip entirely when there is nothing to do.
        run: |
          set +e
          tofu plan -input=false -lock-timeout=5m -detailed-exitcode -out=tfplan \
            -var="github_org=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="github_owner_id=${{ github.repository_owner_id }}" \
            -var="github_repo_id=${{ github.repository_id }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="alarm_email=${{ vars.ALARM_EMAIL }}"
          code=$?
          echo "tofu plan -detailed-exitcode returned: $code"
          echo "  0 = no changes, 1 = error, 2 = changes present"
          if [ "$code" -eq 1 ]; then
            echo "::error::tofu plan failed"
            exit 1
          fi

          # CROSS-CHECK THE EXIT CODE AGAINST THE PLAN ITSELF.
          #
          # The exit code is a single integer arriving through a shim that has
          # already swallowed it once: on 2026-08-19 `terraform_wrapper: false`
          # was carried through the OpenTofu conversion unrenamed, GitHub
          # treated the unknown input as a warning, the wrapper stayed on, and
          # a plan reading "0 to add, 2 to change" reported exitcode 0. The
          # apply skipped itself and the run went GREEN. Nothing failed; the
          # change simply never happened.
          #
          # The plan file cannot lie about its own contents, so it is the
          # authority and the exit code is checked against it. Disagreement is
          # a hard failure: it means the toolchain is not reporting what it
          # did, and no gate downstream of that is trustworthy.
          n=$(tofu show -json tfplan \
              | python3 -c 'import json,sys; print(sum(1 for r in json.load(sys.stdin).get("resource_changes",[]) if r["change"]["actions"]!=["no-op"]))')
          echo "plan file contains $n changing resource(s)"

          want=0; [ "$n" -gt 0 ] && want=2
          if [ "$code" -ne "$want" ]; then
            echo "::error::tofu reported exitcode $code but the plan file holds $n changing resource(s) (expected exitcode $want). The exit code is being swallowed -- check that tofu_wrapper is false and that setup-opentofu did not warn about an unknown input."
            exit 1
          fi

          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: refuse a plan that destroys or replaces protected resources
        working-directory: infra/terraform
        # This runs BEFORE any human sees the plan summary, so a destructive
        # plan cannot be approved by someone skim-reading a green check.
        #
        # ALLOW_REPLACE IS REACHABLE ONLY FROM A MANUAL DISPATCH. A push can
        # never set it, so no merge can replace a running host by accident --
        # replacing one takes a person choosing to, on a specific run, and the
        # apply is still gated on the protected `paper` environment afterwards.
        # Before this input existed the guard was unsatisfiable: a legitimate
        # replacement could only ship by editing the guard, which is precisely
        # how a safety check becomes something people route around.
        env:
          ALLOW_REPLACE: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_replace) && '1' || '' }}
          # THE NARROW ALLOWANCE, AND WHY IT IS SAFE TO SET ON A PUSH.
          #
          # Replacing the bot host is the ordinary consequence of editing
          # user-data or the strategy variant -- `user_data_replace_on_change`
          # guarantees it -- so under the old rule every such change needed a
          # dispatch with a flag and then an approval. In practice that meant
          # the flag was set reflexively, which is a worse guard than none: it
          # trained the operator to approve replacements without reading them.
          #
          # This lists the two types whose replacement is expected and
          # reversible. A bare DESTROY of either is still refused, and every
          # stateful resource -- the database above all -- is absent from this
          # list and therefore unreachable from an unattended apply.
          # tests/test_tf_guard_narrow_replace.py fails if that stops being
          # true, including if someone widens this line.
          ALLOW_REPLACE_TYPES: aws_instance,aws_eip
        run: |
          tofu show -json tfplan > tfplan.json
          python3 ../../scripts/tf_guard.py tfplan.json

      - name: cost guard -- refuses NAT gateways, load balancers, EKS, autoscalers
        working-directory: infra/terraform
        # This FAILS the job rather than warning. A warning in a log nobody
        # reads is exactly where an accidental $32/month NAT gateway survives.
        run: |
          python3 ../../scripts/tf_cost_preview.py tfplan.json | tee cost.txt
          {
            echo '### Estimated resources'
            echo '```'
            cat cost.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: human-readable plan
        working-directory: infra/terraform
        run: tofu show -no-color tfplan | tee plan.txt

      - name: post the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/terraform/plan.txt', 'utf8');
            const LIMIT = 60000;
            if (plan.length > LIMIT) plan = plan.slice(0, LIMIT) + '\n... truncated; see the job log ...';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '#### Terraform plan (`paper`)\n\n```hcl\n' + plan + '\n```',
            });

      - name: keep the plan for the apply job
        if: github.ref == 'refs/heads/master' && steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/tfplan
          retention-days: 1

  apply:
    name: apply
    needs: plan
    if: github.ref == 'refs/heads/master' && needs.plan.outputs.changes == '2'
    runs-on: ubuntu-latest
    # NO ENVIRONMENT GATE. A merge to master applies.
    #
    # This job used to run in the protected `paper` environment so that every
    # infrastructure change waited on a required reviewer. That was removed
    # deliberately, and what replaced it is not nothing:
    #
    #   * a pull request still plans with a READ-ONLY role and posts the plan
    #     as a comment, so the review happens where a review belongs -- on the
    #     diff, before merge, rather than on a green check afterwards;
    #   * tf_guard still refuses any DESTROY, and any REPLACE outside
    #     `aws_instance` / `aws_eip` (see the step above);
    #   * the cost guard still fails the job on a NAT gateway or a load
    #     balancer;
    #   * the apply still applies the exact reviewed plan FILE, not a fresh
    #     plan of a world that may have moved.
    #
    # The approval was gating the wrong thing. It sat after the plan was
    # already reviewed on the PR, it could not distinguish replacing a host
    # from dropping the database -- tf_guard can -- and being the only thing
    # between a merge and production made it a formality, which is the state
    # in which approvals stop being read.
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}
          # The wrapper shims the binary and writes its own `exitcode` step
          # output. The apply gate reads -detailed-exitcode, so two writers of
          # the same key is exactly the ambiguity to remove: the first run with
          # a real 41-resource plan produced a correct plan and then skipped
          # apply, because the gate never saw a 2.
          #
          # THE KEY IS `tofu_wrapper`, NOT `terraform_wrapper`. Converting this
          # file from hashicorp/setup-terraform to opentofu/setup-opentofu on
          # 2026-08-19 kept the old spelling, and an unknown input to a GitHub
          # action is a WARNING, not an error -- so the setting was silently
          # dropped, the wrapper stayed on, and the bug above came straight
          # back. A two-line plan with real changes reported exitcode 0 and
          # apply skipped itself. See the cross-check in the plan step, which
          # exists because this failure mode is invisible.
          tofu_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/terraform

      - name: init
        working-directory: infra/terraform
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: apply the reviewed plan, not a fresh one
        working-directory: infra/terraform
        # Applying the SAVED plan file, never `apply -auto-approve` against a
        # re-planned world. What was reviewed is what is applied.
        run: tofu apply -input=false -lock-timeout=5m tfplan

      - name: AWS preflight -- the applied stack
        # Re-run after apply, in the strict phase, with no plan to excuse an
        # absence. Everything must now actually exist.
        run: |
          python3 scripts/aws_preflight.py --phase application \
            --region "$AWS_REGION" \
            --account "${{ vars.AWS_ACCOUNT_ID }}" \
            --state-bucket "${{ vars.TF_STATE_BUCKET }}"

      - name: create each stack's database if it does not exist
        # THE DATABASE BELONGS TO INFRASTRUCTURE, NOT TO THE DEPLOY.
        #
        # It cannot be a Terraform resource: RDS sits in a private subnet with
        # no route from a CI runner, so the postgresql provider cannot reach
        # it, and the alternatives (a bastion, a NAT gateway, a VPC Lambda) are
        # permanent infrastructure existing to run one statement. It cannot be
        # in user_data either: creating a database is a privileged operation on
        # a shared resource, and putting it on the boot path re-runs it on
        # every replacement.
        #
        # So it runs here, from the host, over SSM, immediately after apply and
        # before any deploy can need it. scripts/create_stack_database.sh is
        # idempotent -- "already exists; nothing to do" -- and resolves the
        # master credentials on the instance, so no secret passes through this
        # runner or its logs.
        run: |
          set -euo pipefail
          # The host reads its own DB_NAME from /opt/deltabt/env, so this needs
          # no per-stack table: every running bot host ensures its own database.
          ids=$(aws ec2 describe-instances --region "$AWS_REGION" \
                 --filters "Name=tag:Name,Values=deltabt-paper-*" \
                           "Name=instance-state-name,Values=running" \
                 --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$ids" ]; then
            echo "::warning::no running bot hosts; nothing to do"
            exit 0
          fi

          # WAIT FOR THE HOST TO BE REACHABLE BY SSM BEFORE TALKING TO IT.
          #
          # This step runs immediately after an apply that may have REPLACED
          # the instance, and a freshly booted host takes a minute or two to
          # register as a managed node. On 2026-09-04 it did not, this step
          # failed, and the failure cascaded: the deploy's wait job correctly
          # refused to roll onto a failed infrastructure run, nothing started
          # the bot -- user_data only ENABLES the unit, the deploy starts it --
          # and the arm sat down until it was finished by hand.
          #
          # The database itself was fine; the step was a no-op that failed on
          # timing. So wait, and only then decide anything.
          for id in $ids; do
            echo "waiting for $id to become an SSM managed node"
            for _ in $(seq 1 30); do
              ping=$(aws ssm describe-instance-information --region "$AWS_REGION" \
                      --filters "Key=InstanceIds,Values=$id" \
                      --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo None)
              [ "$ping" = "Online" ] && break
              sleep 10
            done
            [ "$ping" = "Online" ] || { echo "::error::$id never became SSM-managed"; exit 1; }
            echo "  $id online"
          done
          # THE PARAMETERS GO IN A FILE, NOT ON THE COMMAND LINE. The
          # `--parameters key=value` shorthand splits on commas and cannot
          # carry a value containing quotes, and the command below has both.
          # Passing it inline fails with a ParamValidation error pointing at
          # a column in a 4KB base64 blob, which is a genuinely terrible way
          # to spend an afternoon.
          python3 - <<'PY' > /tmp/ssm-params.json
          import base64, json, pathlib
          script = base64.b64encode(
              pathlib.Path("scripts/create_stack_database.sh").read_bytes()).decode()
          cmd = (f"echo {script} | base64 -d > /tmp/cdb.sh && chmod +x /tmp/cdb.sh"
                 " && . /opt/deltabt/env && sudo /tmp/cdb.sh \"$DB_NAME\"")
          print(json.dumps({"commands": [cmd]}))
          PY
          for id in $ids; do
            echo "::group::database on $id"
            cmd=$(aws ssm send-command --region "$AWS_REGION" \
              --instance-ids "$id" --document-name AWS-RunShellScript \
              --parameters file:///tmp/ssm-params.json \
              --query 'Command.CommandId' --output text)
            st=Pending
            for _ in $(seq 1 40); do
              st=$(aws ssm get-command-invocation --region "$AWS_REGION" \
                    --command-id "$cmd" --instance-id "$id" \
                    --query Status --output text 2>/dev/null || echo Pending)
              case "$st" in Success|Failed|Cancelled|TimedOut) break ;; esac
              sleep 10
            done
            aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$cmd" --instance-id "$id" \
              --query 'StandardOutputContent' --output text || true
            echo "::endgroup::"
            [ "$st" = "Success" ] || { echo "::error::database creation failed on $id"; exit 1; }
          done

      - name: outputs
        working-directory: infra/terraform
        run: |
          {
            echo "### Infrastructure"
            echo '```'
            tofu output
            echo '```'
            echo
            echo "Successful infrastructure deployment does not create an"
            echo "experiment and does not start paper trading."
          } >> "$GITHUB_STEP_SUMMARY"
