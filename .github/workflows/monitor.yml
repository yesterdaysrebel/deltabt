name: daily-report

# The daily forward-test report. Runs on GitHub's schedule, on GitHub's
# runners, so it needs nobody's laptop to be on.
#
# It is a READ-ONLY observer. It authenticates as deltabt-paper-github-monitor,
# which can read infrastructure and invoke exactly one fixed SSM document --
# not AWS-RunShellScript, and not the deploy document. It cannot deploy, cannot
# change infrastructure, and cannot touch the experiment.
#
# Alerting is deliberately unconfigured, so this is the pull that replaces it:
# the report lands in the run summary, and a FAILED run emails you, which is
# the notification path that costs nothing and needs no SNS.

on:
  # 01:30 UTC = 7:00 AM IST. Removed 2026-10-01 with the last stack, restored
  # 2026-10-02 for the prod dry run (`dryrun`), whose owner reads it daily.
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "UTC date to report on (YYYY-MM-DD). Blank = yesterday."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    name: "daily report: ${{ matrix.stack }} (${{ matrix.variant }})"
    runs-on: ubuntu-latest
    # ONE JOB PER CONCURRENT EXPERIMENT.
    #
    # fail-fast is off deliberately: a problem on one host must not cancel the
    # other's report. They are separate experiments on separate databases and
    # the whole value of the report is that it is produced unattended, so
    # losing v2's report because v1 was unhealthy would be exactly backwards.
    strategy:
      fail-fast: false
      matrix:
        include:
          # v1 and v2 were decommissioned 2026-08-19. Their experiments were
          # stopped with a reason first, then the stacks were destroyed --
          # instances, EIPs, SSM documents and log groups. Their DATA survives:
          # the per-stack databases are not Terraform-managed and the RDS
          # instance carries prevent_destroy. Leaving them in this matrix would
          # fail every run on a missing instance id, which is a false alarm
          # about an experiment that was ended deliberately.
          #
          # v3 and v4 followed them on 2026-08-25, and left the same footprint
          # first: this matrix kept naming two terminated instances, so the
          # scheduled report failed EVERY NIGHT on a missing instance id. A
          # daily failure that is always the same false alarm is worse than no
          # report -- it trains you to ignore the one that is real.
          #
          # v5 and v6 followed on 2026-08-26 after a single day, by
          # instruction. v5's experiment was stopped with a reason; v6 never
          # registered one. Their databases survive; their log groups did not.
          # 2026-10-01: atr, ladder AND ltp ARE REMOVED, by operator instruction
          # ("stop ltp, ladder, atr and testnet"), one day after the 09-30 read of
          # the exit arms. Same footprint as every retirement above: experiments
          # stopped with a reason first, services stopped and disabled, then the
          # hosts removed in Terraform; the databases deltabt_both, deltabt_ladder,
          # deltabt_ltp and deltabt_tnet keep every record. With no stack left this
          # matrix is empty, so the nightly schedule below was removed too: a report
          # that fails every night on "no instances" is the false alarm this comment
          # block keeps warning about. Re-adding a stack means re-adding the schedule.
          # tests/live/test_stack_table_consistency.py holds this table equal to
          # variables.tf.

          # 2026-09-10: `hours` AND `cross` ARE RETIRED, AND ONLY `atr` REMAINS.
          #
          # Both were stopped by operator instruction at day 4 -- `hours` of 30,
          # `cross` of 90 -- and their EC2 hosts, EIPs, log groups, alarms and
          # SSM documents were destroyed the same day. Neither was stopped on
          # its evidence: `hours` was -2.13R over 4 closed trades and `cross`
          # -2.05R over 2, against a `cross` stopping rule (deltabt/catalog.py)
          # that says to make no decision before 40 closed trades or 90 days and
          # to stop early only at -12R or a 20% drawdown. That is recorded here
          # because the reason a run ended belongs beside the table it left.
          #
          # THE DATABASES SURVIVE. deltabt_hours and deltabt_cross are created by
          # scripts/create_stack_database.sh, not by Terraform, and sit on the
          # shared RDS instance, so every trade and signal either arm recorded is
          # still readable. `cross` also left AKEUSD pos_6032e28ea6984a62 OPEN:
          # closing it would have fabricated an exit the strategy never produced.
          #
          # fail-fast stays off above even with one stack, so restoring a second
          # arm needs no change here beyond its own block.

          # 2026-10-02: `dryrun`, the prod dry run (live.tf live_stacks). Its
          # report is scripts/brief_report.py (`report: brief`): one screen,
          # plain English, IST, written for the owner after the long report
          # "made no sense" to them. The paper report stays for paper arms.
          - stack: dryrun
            variant: SPEC:manual_scalp_both_t3_trail@5
            instance_var: BOT_INSTANCE_ID_DRYRUN
            document_var: SSM_MONITOR_DOCUMENT_DRYRUN
            strategy_hash: "cf9917a73c61c14dd0435d1aa56d4e15fa29d5ddaa7e6bc3cde39b7cccf96018"
            log_group: /deltabt/paper/dryrun/bot
            report: brief

    # No `environment:` gate. The gate exists to stop unreviewed CHANGES, and
    # this job cannot make one -- gating it would only mean the report waits
    # for a human, which defeats the point of it running unattended.
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MONITOR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-session-name: gha-report-${{ github.run_id }}

      - name: find the host
        id: host
        # DISCOVERED BY TAG, NOT READ FROM A REPOSITORY VARIABLE.
        #
        # deploy.yml moved off `vars[matrix.instance_var]` on 2026-09-04 after
        # it went stale five times, each stale value aiming SSM at a
        # terminated host. This job had the same bug and kept it, which also
        # made a NEW stack impossible to add hands-free: the instance id does
        # not exist until Terraform has applied, so the variable could only be
        # set by a human afterwards, and until they did the report failed
        # every night on a stack that was perfectly healthy.
        #
        # The monitor role already holds ec2:DescribeInstances (monitoring.tf,
        # "ReadTheInfrastructureItReportsOn"), so this needs no new permission.
        env:
          NAME_TAG: deltabt-paper-${{ matrix.stack }}
        run: |
          set -euo pipefail
          ids=$(aws ec2 describe-instances --region "${{ vars.AWS_REGION || 'ap-south-1' }}" \
            --filters "Name=tag:Name,Values=$NAME_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          n=$(printf '%s\n' $ids | grep -c . || true)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one running host tagged $NAME_TAG, found $n: $ids"
            exit 1
          fi
          echo "instance_id=$ids" >> "$GITHUB_OUTPUT"

      - name: build the brief report
        id: brief
        if: matrix.report == 'brief'
        run: |
          set +e
          python3 scripts/brief_report.py \
            --instance-id "${{ steps.host.outputs.instance_id }}" \
            --log-group "${{ matrix.log_group }}" \
            --stack "${{ matrix.stack }}" \
            --document "${{ vars[matrix.document_var] || format('deltabt-paper-{0}-monitor', matrix.stack) }}" \
            --region "${{ vars.AWS_REGION || 'ap-south-1' }}" \
            --facts-json facts.json \
            > report.md
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md

      - name: build the report
        id: report
        if: matrix.report != 'brief'
        run: |
          set +e
          python3 scripts/daily_report.py \
            --instance-id "${{ steps.host.outputs.instance_id }}" \
            --log-group "${{ matrix.log_group }}" \
            --stack "${{ matrix.stack }}" \
            --document "${{ vars[matrix.document_var] || format('deltabt-paper-{0}-monitor', matrix.stack) }}" \
            --region "${{ vars.AWS_REGION || 'ap-south-1' }}" \
            --expect-strategy-hash "${{ matrix.strategy_hash }}" \
            --facts-json facts.json \
            ${{ matrix.review_days && format('--review-days {0}', matrix.review_days) || '' }} \
            ${{ matrix.review_trades && format('--review-trades {0}', matrix.review_trades) || '' }} \
            ${{ vars.EXPECTED_RISK_HASH && format('--expect-risk-hash {0}', vars.EXPECTED_RISK_HASH) || '' }} \
            ${{ github.event.inputs.day && format('--day {0}', github.event.inputs.day) || '' }} \
            > report.md
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md

      - name: keep the report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ matrix.stack }}-${{ github.run_id }}
          # facts.json is what the digest job below reads. It is the SAME
          # numbers the report printed, written once by the code that computed
          # them, so the digest cannot drift from the report by re-deriving
          # anything or by parsing markdown.
          path: |
            report.md
            facts.json
          if-no-files-found: warn
          retention-days: 90

      - name: email the report
        # THE REPORT NOW REACHES A PERSON WHETHER OR NOT IT IS BAD NEWS.
        #
        # It used to have one route out: the failing run below, which GitHub
        # emails the actor about. An ALL CLEAR therefore notified nobody, and
        # on 2026-08-29 the operator confirmed the SNS subscription, waited for
        # the report, and got nothing -- correctly, because nothing published
        # to it. Alarms did arrive, which made the silence look like proof the
        # wiring worked.
        #
        # `continue-on-error` because a notification that can fail the run it
        # describes would turn "SNS had a bad minute" into "the bot needs
        # attention". The report is already in the summary and the artifact;
        # this is a third copy, not the record.
        continue-on-error: true
        env:
          OUTCOME: ${{ (steps.report.outputs.exitcode || steps.brief.outputs.exitcode) == '0' && 'all clear' || 'NEEDS ATTENTION' }}
        run: |
          set -uo pipefail
          # Matched by suffix rather than a pinned ARN: the stack publishes to
          # exactly one alarms topic, and a hand-copied ARN is the same kind of
          # stale variable that pointed the deploy at a terminated instance.
          TOPIC="$(aws sns list-topics --region "${{ vars.AWS_REGION || 'ap-south-1' }}" \
                    --query "Topics[?ends_with(TopicArn, ':deltabt-paper-alarms')].TopicArn" \
                    --output text)"
          if [ -z "$TOPIC" ] || [ "$TOPIC" = "None" ]; then
            echo "no alarm topic found -- alarm_email is probably unset; skipping"
            exit 0
          fi
          # SNS caps a subject at 100 characters and a message at 256KB. The
          # subject carries the verdict so the inbox is readable without
          # opening anything; the body is the whole report, truncated well
          # under the cap rather than risking a rejected publish.
          head -c 200000 report.md > body.txt
          aws sns publish --region "${{ vars.AWS_REGION || 'ap-south-1' }}" \
            --topic-arn "$TOPIC" \
            --subject "deltabt ${{ matrix.stack }} daily report -- $OUTCOME" \
            --message file://body.txt \
            --query MessageId --output text

      - name: fail the run if the report found a problem
        # The failing run remains a notification, but is no longer the ONLY
        # one: the step above emails the report either way. This still exists
        # because a red run is visible in the Actions list forever, whereas an
        # email is read once and archived.
        run: |
          if [ "${{ steps.report.outputs.exitcode || steps.brief.outputs.exitcode }}" != "0" ]; then
            echo "::error::The daily report found something that needs attention -- see the summary."
            exit 1
          fi
          echo "All clear."

  digest:
    name: both arms, one email
    needs: report
    # ALWAYS, because the arm that needs attention is the one whose job failed,
    # and a digest that skips itself exactly when something is wrong is worse
    # than no digest. `report` fails the run when it finds a problem.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: daily-report-*-${{ github.run_id }}
          path: facts

      - name: compare the arms
        id: digest
        run: |
          set +e
          python3 scripts/arms_digest.py facts/*/facts.json > digest.md
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          cat digest.md >> "$GITHUB_STEP_SUMMARY"
          cat digest.md

      - uses: actions/upload-artifact@v4
        with:
          name: arms-digest-${{ github.run_id }}
          path: digest.md
          retention-days: 90

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MONITOR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-session-name: gha-digest-${{ github.run_id }}

      - name: email the digest
        # THE ONE MESSAGE WORTH READING FIRST. Each arm still emails its own
        # full report; this arrives alongside them and answers "is either arm
        # in trouble, and what did they each do" without opening either.
        #
        # continue-on-error for the same reason the per-arm publish has it: a
        # notification that can fail the run it describes turns "SNS had a bad
        # minute" into "the bot needs attention".
        continue-on-error: true
        env:
          OUTCOME: ${{ steps.digest.outputs.exitcode == '0' && 'all clear' || 'NEEDS ATTENTION' }}
        run: |
          set -uo pipefail
          # ONE ARM, ONE EMAIL (2026-10-02): with a single report the digest
          # repeats it under a "both arms" subject. Sent only when it adds a
          # comparison, i.e. when more than one arm reported.
          if [ "$(ls facts/*/facts.json 2>/dev/null | wc -l)" -le 1 ]; then
            echo "one arm reported; its own email is the report -- skipping the digest email"
            exit 0
          fi
          TOPIC="$(aws sns list-topics --region "${{ vars.AWS_REGION || 'ap-south-1' }}" \
                    --query "Topics[?ends_with(TopicArn, ':deltabt-paper-alarms')].TopicArn" \
                    --output text)"
          if [ -z "$TOPIC" ] || [ "$TOPIC" = "None" ]; then
            echo "no alarm topic found; skipping"
            exit 0
          fi
          head -c 200000 digest.md > body.txt
          aws sns publish --region "${{ vars.AWS_REGION || 'ap-south-1' }}" \
            --topic-arn "$TOPIC" \
            --subject "deltabt both arms -- $OUTCOME" \
            --message file://body.txt \
            --query MessageId --output text
