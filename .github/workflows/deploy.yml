name: deploy

# LIFECYCLE STAGE 3 of 3: APPLICATION.
#
# Build the image, push it to ECR, and roll the bot onto it. This workflow
# cannot change infrastructure -- its role can push to one ECR repository and
# invoke one SSM document, and that is all. Terraform is not run here.
#
# Deployment goes through SSM Run Command. There is no SSH path: no key pair
# exists in this stack, and the security group has no inbound rule to use one
# with.
#
# It does not start paper trading. Nothing does, automatically.
#
# The image tag is ALWAYS the git SHA. Never `latest`. A forward test whose
# results cannot be tied to an exact commit is not a forward test, and the
# image tag is the only durable link between a row in the database and the
# code that produced it.

on:
  push:
    branches: [master]
    # DEPLOYS ARE NOT FREE, AND THIS FILTER IS NOT TIDINESS.
    #
    # The experiment identity includes git_sha, so bind_experiment() refuses to
    # start when the container's SHA differs from the one the RUNNING forward
    # test recorded. /readyz never passes, deploy.sh rolls the host back, and
    # the job goes red. The only way to make a deploy SUCCEED is to stop the
    # experiment, deploy, and start a new experiment id -- which ends the run
    # and resets the sample to zero.
    #
    # So a commit that reaches this workflow without changing the image costs
    # two container restarts, two warm-up gaps in a live experiment, and a red
    # run, to ship nothing. 2026-08-18: fb69f7e added a 9,787-line research CSV
    # and all three roll jobs failed on drift, leaving V3's experiment stopped
    # as collateral. 2026-08-20: scripts/ and then tests/ did the same thing
    # twice in one day.
    #
    # A commit touching BOTH a matching and a non-matching path still deploys,
    # which is correct -- if any of the image changed, the image changed.
    #
    # AN ALLOW-LIST, BECAUSE THE DENY-LIST KEPT BEING WRONG.
    #
    # The rule has always been "is it in the image", but it was expressed as a
    # list of things that are NOT, which is unbounded: every directory nobody
    # thought of defaults to triggering a roll. On 2026-08-20 that cost two
    # red deploys and four container restarts in a live experiment -- first
    # scripts/, then tests/, neither of which the Dockerfile copies. Each fix
    # patched one hole in a surface with no edge.
    #
    # Inverted, the list has an edge, and it is the Dockerfile. deploy/docker/
    # is included because changing HOW the image is built changes the image as
    # surely as changing what goes into it.
    #
    # README.md is copied into the image and deliberately left out: it changes
    # nothing the container does, and rolling a live experiment to ship a
    # paragraph is the behaviour this whole block exists to prevent.
    #
    # tests/test_paths_match_dockerfile.py fails if a COPY line appears here
    # without a matching entry, so the next person to add one to the image is
    # told rather than left to discover it as a stale git_sha weeks later.
    paths:
      - 'app/**'
      - 'deltabt/**'
      # THE LIVE PACKAGE. Dockerfile.live carries `COPY live ./live`, so a
      # change here changes the live image exactly as app/ changes the paper
      # one -- and this was missing until 2026-09-15, when the fix that made
      # LiveBroker usable at all merged to master, triggered nothing, and left
      # the broken image running on the host.
      #
      # The test that exists to catch this read only the PAPER Dockerfile, so
      # it had nothing to say about a COPY in the other one. It now reads both.
      - 'live/**'
      # Offline analysis drivers. They ship, since deltabt/ is copied whole,
      # but nothing under app/ imports a run_*.py. Five were added in a single
      # day of research and each one rolled the bot.
      - '!deltabt/research/run_*.py'
      - 'deploy/docker/**'
      - 'pyproject.toml'
      # NOT PART OF THE IMAGE, AND IT STILL HAS TO ROLL.
      #
      # This file holds the universe, the variant and the risk knobs -- the
      # things the experiment's config_hash is computed FROM. Change one and
      # Terraform replaces the host with a different identity, but nothing
      # here matched, so no deploy ran and no successor experiment was
      # registered. The new host then came up against a database holding a
      # RUNNING experiment whose hash no longer matched, and bind_experiment
      # refused it: a bot live and unable to bind, with no failure anywhere
      # to say so.
      #
      # That is exactly what happened to SOLUSD on 2026-09-04: merged, then
      # stranded unapplied because the only workflow that could have carried
      # it never fired.
      #
      # The image is unchanged when only this file moves, so the roll is a
      # no-op for the container; what it actually buys is the experiment
      # lifecycle -- retire the old run, register a successor on the new
      # identity. tests/live/test_identity_paths_trigger_deploy.py fails if
      # this entry is removed.
      - 'infra/terraform/variables.tf'
      # THE SAME FILE, FOR LIVE STACKS -- and the same failure, found before it
      # happened rather than after.
      #
      # live.tf holds the live_stacks map: the variant, the database, and by
      # extension the venue a live host trades on. It is to a live stack
      # exactly what variables.tf is to a paper one.
      #
      # Without this entry the FIRST merge that adds a live stack strands it.
      # infrastructure.yml matches `infra/**` and builds the host; nothing here
      # matches, so no image is built and the image_tag parameter stays "none";
      # run_live.sh reads "none" and exit 90s. The host sits there costing
      # money and looking healthy, and the bot starts whenever somebody next
      # happens to touch app/ -- which is the SOLUSD failure above, repeated.
      #
      # Widening the trigger does NOT endanger the paper run: the roll step
      # refuses any stack with a RUNNING experiment and says so.
      - 'infra/terraform/live.tf'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing tag to roll back to. Leave empty to build this commit."
        required: false
        type: string
      only_stack:
        description: >-
          Roll ONE stack instead of all of them. Blank rolls every stack.
          A push cannot use this, so bringing a new arm up without disturbing
          an established one means dispatching manually: a push-triggered
          deploy rolls every stack, and any stack with a RUNNING experiment
          refuses the new SHA on drift, rolls itself back and goes red.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  # One deploy at a time. Two concurrent SSM deploys would fight over the same
  # systemd unit and the rollback tag.
  group: deploy-paper
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  wait-for-infrastructure:
    # ORDERING, WHICH IS THE WHOLE REASON A MERGE USED TO NEED A SECOND PUSH.
    #
    # Both workflows trigger on the same push. Terraform may REPLACE the host
    # -- a changed variant or user-data always does -- so a deploy that starts
    # at the same moment aims SSM at an instance that is about to be
    # terminated, and fails. That is exactly what happened on the merge of
    # #39: the push-triggered deploy failed, and shipping took a hand-run
    # dispatch afterwards.
    #
    # TWO WAITS, AND THE SECOND ONE IS NOT OPTIONAL.
    #
    #   1. THIS COMMIT's infrastructure run, if it has one, must have applied
    #      cleanly before its image is rolled onto the result.
    #   2. ANY infrastructure run still in flight on master, whatever the
    #      commit. On 2026-09-04 two pull requests were merged sixteen seconds
    #      apart: #37 touched only `deltabt/` so it had no infrastructure run
    #      of its own, sailed past wait (1), and rolled while #42's apply --
    #      which REPLACES the host -- was still running. A deploy aimed at an
    #      instance that is being terminated is the failure this job exists to
    #      prevent, and waiting only on our own SHA does not prevent it.
    name: wait for infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: block until no infrastructure run can move the ground
        uses: actions/github-script@v7
        with:
          script: |
            const deadline = Date.now() + 45 * 60 * 1000;
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            const list = (params) => github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'infrastructure.yml',
              per_page: 30,
              ...params,
            });

            while (true) {
              // (1) our own commit, if infrastructure ran for it at all
              const mine = (await list({ head_sha: context.sha })).data.workflow_runs;
              const mineUnfinished = mine.filter(r => r.status !== 'completed');
              const mineBad = mine.filter(
                r => r.status === 'completed' && !['success', 'skipped'].includes(r.conclusion));
              if (mineBad.length) {
                core.setFailed(
                  `infrastructure concluded '${mineBad[0].conclusion}' for this commit ` +
                  `(${mineBad[0].html_url}). Refusing to roll an image onto infrastructure ` +
                  `that did not apply cleanly.`);
                return;
              }

              // (2) anything else still applying on master, any commit
              const onMaster = (await list({ branch: 'master' })).data.workflow_runs;
              const othersInFlight = onMaster.filter(r => r.status !== 'completed');

              if (mineUnfinished.length === 0 && othersInFlight.length === 0) {
                core.info(mine.length
                  ? 'this commit\'s infrastructure applied cleanly; nothing else in flight'
                  : 'no infrastructure run for this commit; nothing else in flight');
                return;
              }
              if (Date.now() > deadline) {
                core.setFailed('timed out waiting for infrastructure to settle');
                return;
              }
              core.info(
                `waiting: ${mineUnfinished.length} for this commit, ` +
                `${othersInFlight.length} in flight on master`);
              await sleep(20000);
            }

  test:
    # The whole suite, including the paper-only AST scan, on the exact commit
    # being shipped. Nothing reaches the host without it.
    uses: ./.github/workflows/test.yml

  build-live:
    # THE LIVE IMAGE, BUILT ONLY IF SOMEWHERE TO PUT IT EXISTS.
    #
    # It is a SEPARATE image because the paper image deliberately does not
    # carry the `live` package -- app/safety.py's boundary is the absence of
    # order-placement capability, not a runtime toggle -- and a separate ECR
    # repository because two images in one repository, distinguished only by a
    # tag convention, is one typo away from rolling a paper host onto a bot
    # that can place orders.
    #
    # SELF-ACTIVATING, AND THAT IS THE POINT. infra/terraform/live.tf creates
    # that repository only when var.live_stacks has an entry, so today this job
    # finds nothing and skips with a notice. Nothing here needs editing when a
    # live stack is added -- which matters because the alternative is a step
    # somebody has to remember, and this pipeline has already been bitten twice
    # by exactly that (a risk limit that reached the host but never the
    # container, and a stack table that drifted from Terraform).
    name: build and push the live image
    # WAITS FOR INFRASTRUCTURE, and the first merge with a live stack proved why.
    #
    # This job asks ECR whether the live repository exists. Both that repository
    # AND the ecr:DescribeRepositories grant that lets it ask are created by the
    # infrastructure apply -- so on the merge that first adds a `live_stacks`
    # entry, this ran four minutes ahead of the apply and got AccessDenied:
    #
    #   User: .../deltabt-paper-github-app-deploy is not authorized to perform:
    #   ecr:DescribeRepositories on resource: .../deltabt-live
    #
    # It failed loudly rather than reporting "no live stack is configured",
    # which is the check working. But the race is real and would repeat on
    # every future change that moves those resources, so the job now orders
    # itself behind the apply the way `deploy` already does.
    needs: [test, wait-for-infrastructure]
    outputs:
      # WITHOUT THESE NOTHING COULD CONSUME THE BUILD. build-live pushed an
      # image and published nothing, and no job declared `needs: build-live`,
      # so the live image was built, stored, and never deployed by anything.
      #
      # The tag is the commit SHA, which is what the build step below actually
      # pushes -- and it must be, because preflight FAILS on an unknown SHA and
      # the container has no git.
      tag: ${{ github.sha }}
      repository: ${{ steps.repo.outputs.name }}
      exists: ${{ steps.repo.outputs.exists }}
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-live-${{ github.run_id }}

      - name: is there a live image repository yet?
        id: repo
        run: |
          set -euo pipefail
          # deltabt-PAPER-live, and the dash-paper is not a typo: Terraform
          # names it "${local.name}-live" and local.name is
          # "deltabt-${var.environment}", with environment defaulting to
          # "paper" account-wide. This fallback read 'deltabt-live' and the
          # repository is 'deltabt-paper-live', so the lookup asked about a
          # repository this role has no grant on and came back AccessDenied --
          # which reads as a permissions bug and is really a name mismatch.
          NAME="${{ vars.ECR_REPOSITORY_LIVE || 'deltabt-paper-live' }}"
          # ABSENT AND DENIED ARE NOT THE SAME ANSWER, and this swallowed both.
          #
          # `>/dev/null 2>&1` turned every failure into "no live stack is
          # configured, nothing to build" -- including AccessDenied, which is
          # exactly what this role returned until live.tf granted it
          # ecr:DescribeRepositories. The repository could then exist and the
          # build would skip forever, printing a reassuring notice each time.
          # A step that reports the expected state on a degraded path is worse
          # than one that fails.
          err=$(aws ecr describe-repositories --repository-names "$NAME" 2>&1 >/dev/null) && rc=0 || rc=$?
          if [ "${rc:-0}" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$err" | grep -q 'RepositoryNotFoundException'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no $NAME repository; no live stack is configured, so there is nothing to build. This is the expected state until infra/terraform/live.tf has a live_stacks entry."
          else
            echo "::error::could not determine whether $NAME exists: $err"
            echo "This is NOT the 'no live stack is configured' case, and treating it as one would skip the build silently."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
        if: steps.repo.outputs.exists == 'true'

      - name: refuse to rebuild an existing tag
        if: steps.repo.outputs.exists == 'true'
        run: |
          if aws ecr describe-images --repository-name "${{ steps.repo.outputs.name }}" \
               --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "::notice::${GITHUB_SHA} is already in ECR; skipping the live build."
            echo "already_built=true" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.repo.outputs.exists == 'true' && env.already_built != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.repo.outputs.exists == 'true' && env.already_built != 'true'

      - name: build for arm64 and push
        if: steps.repo.outputs.exists == 'true' && env.already_built != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.live
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_DIRTY=0
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.repo.outputs.name }}:${{ github.sha }}

  targets:
    # WHICH STACKS TO ROLL, DECIDED BEFORE THE MATRIX EXISTS.
    #
    # only_stack cannot be applied in the deploy job's `if`: the matrix context
    # is not available there -- available contexts for jobs.<id>.if are github,
    # needs, vars and inputs, and nothing else. Referencing matrix.stack there
    # does not evaluate false, it makes the whole WORKFLOW invalid, and GitHub
    # rejects it before creating a single job. Learned by doing it.
    #
    # So the filter runs where the list is still data. Emitting JSON that the
    # deploy job expands with fromJSON is the supported way to vary a matrix,
    # and it keeps the stack table in one place.
    name: choose stacks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          ONLY: ${{ github.event.inputs.only_stack }}
        run: |
          set -euo pipefail
          # THIS TABLE IS A SECOND COPY OF THE TERRAFORM STACKS MAP, AND IT
          # DRIFTED. v3 and v4 were removed from infra/terraform/variables.tf
          # on 2026-08-25 and their hosts terminated, but this line still named
          # them -- so the merge that added v5 dispatched a roll at two
          # instance ids that no longer exist, and `only_stack=v5` would have
          # been rejected as matching no stack.
          #
          # Nothing here can detect that on its own: the deploy role can read
          # one ECR repository and invoke one SSM document, so it cannot query
          # Terraform state to derive this list. The table stays hand-written,
          # which means adding or removing a stack is THREE edits --
          # variables.tf, here, and monitor.yml.
          #
          # `instance_var` IS DEAD AND IS KEPT ONLY AS A LABEL. The host is now
          # discovered by its Name tag at roll time (see "find the host"),
          # because the repository variable it used to name went stale on every
          # instance replacement -- five times -- and each stale value aimed
          # SSM at a terminated host.
          # `variant` here is a LABEL for the job name only; the running arm is
          # set by DELTABOT_VARIANT from user_data, not by this table. Kept in
          # step with infra/terraform/variables.tf so the job title does not
          # announce a strategy the host is not running.
          # WHETHER TO ROLL IS ASKED OF THE HOST, NOT DECLARED HERE.
          #
          # Until 2026-09-07 a push to master rolled EVERY stack. That is not a
          # tidiness problem: the experiment identity includes git_sha, so
          # rolling a host retires its RUNNING experiment and registers a
          # successor, resetting the risk ledger to 10,000 and the sample to
          # zero. It happened to `hours` on 2026-09-07 -- an arm four days into
          # a 30-day run, rolled by a merge that had nothing to do with it.
          #
          # The fix then was a `"pinned":true` flag on this line. It worked,
          # and it had two faults. It must be hand-edited twice per experiment,
          # and a human editing a JSON string inside a shell script is the same
          # class of mistake it was protecting against. And a stack left pinned
          # after its run ends blocks every subsequent deploy silently -- the
          # steady state was "every stack pinned, nothing ever ships".
          #
          # So the flag is gone and the question is asked at roll time, in the
          # deploy job's "may we roll this host?" step: the host is sent
          # `Action=status` and answers whether an experiment is RUNNING. A
          # merge now ships everything by default and skips exactly the hosts
          # where rolling would destroy data -- no edit, and no stack left
          # pinned by accident. It fails closed: an unreadable host is not
          # rolled.
          #
          # A protected stack therefore sits on an older image than master.
          # That is correct and is the point. Adding a family to
          # deltabt/catalog.py does not move any other family's config_hash, so
          # its strategy identity does not drift while it waits.
          all='[{"stack":"atr","variant":"SPEC:manual_scalp_both_t3@5","instance_var":"BOT_INSTANCE_ID_ATR","document_var":"SSM_DEPLOY_DOCUMENT_ATR"}]'
          if [ -n "${ONLY:-}" ]; then
            picked=$(printf '%s' "$all" | jq -c --arg s "$ONLY" '[.[] | select(.stack==$s)]')
            if [ "$picked" = "[]" ]; then
              # IT MAY BE A LIVE STACK, and that is not an error here.
              #
              # `only_stack=tnet` is the dispatch that kicks a live host after
              # its credential secret is created -- the normal way a live stack
              # is brought up, because creating the API key needs the host's
              # EIP and so cannot happen before the apply. Failing this job on
              # it would turn the routine path into a red run, and `deploy` is
              # gated on this job's matrix, so the failure would not even be
              # self-explanatory. targets-live handles live stacks; this job
              # steps aside for them.
              if python3 scripts/live_stacks_matrix.py "$ONLY" >/dev/null 2>&1; then
                echo "::notice::only_stack='$ONLY' is a LIVE stack; the paper path has nothing to roll (targets-live handles it)"
                echo "matrix=[]" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::only_stack='$ONLY' matches no paper or live stack; nothing would roll"
              exit 1
            fi
            echo "explicit only_stack='$ONLY': the running-experiment guard is overridden for it"
          else
            # Every stack is a candidate now. The deploy job asks each host
            # whether it may be rolled; see "may we roll this host?".
            picked="$all"
            if [ "$picked" = "[]" ]; then
              echo "no stacks defined; nothing to roll, and that is a success"
            fi
          fi
          echo "rolling: $picked"
          echo "matrix=$picked" >> "$GITHUB_OUTPUT"

  build:
    name: build and push
    needs: test
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: refuse to rebuild an existing tag
        # ECR is configured with IMMUTABLE tags, so a push would fail anyway.
        # Failing here makes the reason obvious instead of surfacing as an
        # opaque registry error.
        run: |
          if aws ecr describe-images --repository-name "${{ vars.ECR_REPOSITORY || 'deltabt' }}" \
               --image-ids "imageTag=${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "::notice::${{ steps.meta.outputs.tag }} is already in ECR; skipping the build."
            echo "already_built=true" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-qemu-action@v3
        if: env.already_built != 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.already_built != 'true'

      - name: build for arm64 and push
        if: env.already_built != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          # The host is Graviton. Building the same architecture it runs on is
          # also what makes the numba kernels baked at build time usable.
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY || 'deltabt' }}:${{ steps.meta.outputs.tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_DIRTY=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: "roll ${{ matrix.stack }} (${{ matrix.variant }})"
    needs: [test, build, targets, wait-for-infrastructure]
    # `always()` so a manual rollback (which skips `build`) still runs, but the
    # build must not have FAILED, and infrastructure must not have failed
    # either -- rolling an image onto a half-applied stack is how a deploy
    # ends up pointing at a terminated host.
    #
    # The last clause is not defensive noise. `matrix.include` expanded from an
    # empty array is not an empty matrix, it is an INVALID one, and GitHub
    # rejects the workflow rather than skipping the job. That is reachable the
    # moment every stack is pinned -- which is the normal state once each arm
    # is mid-experiment -- so without this a routine push would go red for
    # having correctly decided to roll nothing.
    if: >-
      always() && needs.build.result != 'failure'
      && needs.test.result == 'success'
      && needs.wait-for-infrastructure.result == 'success'
      && needs.targets.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # `paper-deploy`, NOT `paper`. Branch-restricted to master, but no required
    # reviewer -- and the distinction is the point.
    #
    # `paper` still gates the Terraform apply, which can destroy instances and
    # has no rollback. On 2026-08-19 a plan with NO configuration change wanted
    # to replace all three bots because Amazon published a new AMI; unattended,
    # that ends three experiments and nobody sees it coming. That gate stays.
    #
    # A bad DEPLOY already fails safe without a human: bind_experiment raises
    # ConfigurationDrift and refuses to run, deploy.sh rolls back when /readyz
    # does not pass, paths-ignore keeps infra and CI edits from triggering this
    # at all, and the AST scan blocks any order-placement code from shipping.
    # Worst case is a red build and a self-healing rollback -- noise, not
    # damage. An approval that only ever rubber-stamps is not a control.
    environment: paper-deploy
    # ONE JOB PER HOST, AND fail-fast IS OFF.
    #
    # The two hosts run different experiments against different databases. If
    # v1 refuses the image on configuration drift, that says nothing about v2,
    # and cancelling v2 mid-roll would leave it on neither the old image nor
    # the new one. Each rolls, verifies and rolls itself back independently.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag || needs.build.outputs.tag }}"
          [ -n "$TAG" ] || { echo "no image tag resolved"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: confirm the image exists before touching the host
        # NOT a full infrastructure preflight. This job authenticates as
        # deltabt-paper-github-app-deploy, which can push one ECR repository
        # and invoke one SSM document -- and nothing else. Asserting that IAM,
        # the state bucket and RDS are all well-formed would require read
        # access this role must not have, and widening it to satisfy a check
        # would dissolve the separation the check exists to protect.
        #
        # The infrastructure workflow runs `aws_preflight.py --phase
        # application` with the role that legitimately can, after every apply.
        run: |
          aws ecr describe-images --region "$AWS_REGION" \
            --repository-name "${{ vars.ECR_REPOSITORY || 'deltabt' }}" \
            --image-ids "imageTag=${{ steps.tag.outputs.tag }}" \
            --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt}' --output json

      - name: warn if a forward test is running
        # Not a hard block: a genuine bug fix during a run is sometimes
        # necessary. But it must be a conscious act, and the log must record
        # that the code changed underneath a running experiment -- otherwise
        # the results describe two different systems wearing one name.
        run: |
          echo "::warning::If a forward test is RUNNING, this changes the code underneath it."
          echo "::warning::Per docs/operations.md that means: stop the experiment, deploy, start a NEW experiment id."

      - name: find the host
        id: host
        # DISCOVERED, NOT CONFIGURED. The repository variable this replaces
        # went stale on every instance replacement -- five times -- and each
        # time the deploy aimed SSM at a terminated host and failed in a way
        # that looks like a broken deploy rather than a stale string. The tag
        # is set by Terraform and cannot drift from the instance it names.
        env:
          NAME_TAG: deltabt-paper-${{ matrix.stack }}
        run: |
          set -euo pipefail
          ids=$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=$NAME_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          n=$(printf '%s\n' $ids | grep -c . || true)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one running host tagged $NAME_TAG, found $n: $ids"
            echo "Two would mean a replacement left an orphan and a deploy could roll the wrong one."
            exit 1
          fi
          echo "instance_id=$ids" >> "$GITHUB_OUTPUT"
          echo "host $ids ($NAME_TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: may we roll this host?
        id: guard
        # THE PIN, DECIDED FROM LIVE STATE INSTEAD OF A HAND-EDITED FLAG.
        #
        # Rolling retires the running experiment and resets its sample to
        # zero. That must not happen by accident -- it happened to `hours` on
        # 2026-09-07, four days into a 30-day run, via a merge that had nothing
        # to do with it. The fix at the time was `"pinned":true` in the stack
        # table, which works but has to be edited by hand twice per experiment,
        # and a human editing a JSON string in a shell script is the same class
        # of mistake it was protecting against. A stack left pinned after its
        # run ends blocks every deploy silently.
        #
        # So the host is asked. An explicit dispatch (only_stack) overrides,
        # because that is already the deliberate act.
        #
        # FAILS CLOSED, AND NOT ON THE EXIT CODE. `forward-test status` exits 1
        # both for "nothing is running" and for every real failure, exactly as
        # `stop` does, so this matches the CLI's own words the way the retire
        # step does. Anything unrecognised -- SSM unreachable, host wedged,
        # timeout -- leaves roll=no and the deploy skips rather than guesses.
        env:
          DEPLOY_DOC: ${{ vars[matrix.document_var] || format('deltabt-paper-{0}-deploy', matrix.stack) }}
          ID: ${{ steps.host.outputs.instance_id }}
          ONLY: ${{ github.event.inputs.only_stack }}
        run: |
          set -euo pipefail
          echo "roll=no" >> "$GITHUB_OUTPUT"
          if [ -n "${ONLY:-}" ]; then
            echo "roll=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::only_stack=$ONLY is a deliberate dispatch; rolling regardless of experiment state"
            exit 0
          fi
          CMD=$(aws ssm send-command --region "$AWS_REGION" \
            --document-name "${DEPLOY_DOC%-deploy}-experiment" --instance-ids "$ID" \
            --parameters "Action=status" \
            --comment "gha ${{ github.run_id }} guard" \
            --query 'Command.CommandId' --output text)
          st=Pending
          for _ in $(seq 1 60); do
            st=$(aws ssm get-command-invocation --region "$AWS_REGION" \
                  --command-id "$CMD" --instance-id "$ID" \
                  --query Status --output text 2>/dev/null || echo Pending)
            case "$st" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          out=$(aws ssm get-command-invocation --region "$AWS_REGION" \
                 --command-id "$CMD" --instance-id "$ID" \
                 --query 'StandardOutputContent' --output text 2>/dev/null || true)
          echo "$out"
          case "$out" in
            *"no experiment is RUNNING"*|*"nothing to protect"*)
              echo "roll=yes" >> "$GITHUB_OUTPUT"
              echo "::notice::no experiment is running on ${{ matrix.stack }}; rolling" ;;
            *)
              # SAY WHICH OF THE TWO IT WAS. The first version reported both
              # possibilities in one sentence -- "has a RUNNING experiment (or
              # its state could not be read: Success)" -- where `Success` is
              # the SSM command's status, not the experiment's. It reads as
              # self-contradictory, and this is the line somebody reads when a
              # deploy silently did not roll.
              if [ "$st" = "Success" ]; then
                why="it has a RUNNING experiment"
              else
                why="its state could not be read (SSM command: $st)"
              fi
              echo "::notice::NOT rolling ${{ matrix.stack }}: $why. End the run, or dispatch deploy.yml with only_stack=${{ matrix.stack }} to roll deliberately."
              echo "${{ matrix.stack }}: not rolled -- $why" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: decide the experiment id
        if: steps.guard.outputs.roll == 'yes'
        id: experiment
        # An experiment records the git_sha it began on, so a code change and
        # the run it belongs to are the same decision. Rolling a new image
        # under a RUNNING experiment is refused by bind_experiment, and
        # rightly: one id would then describe two programs.
        #
        # So a normal deploy retires the running experiment and registers a
        # successor named for the variant, the date and this commit. A manual
        # rollback passes an explicit image_tag and deliberately does NOT --
        # the point of a rollback is to get back to what was running, not to
        # reset the sample to zero.
        env:
          MANUAL_TAG: ${{ github.event.inputs.image_tag }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_TAG:-}" ]; then
            echo "id=none" >> "$GITHUB_OUTPUT"
            echo "::notice::rollback to an explicit tag: experiments left untouched"
            exit 0
          fi
          slug=$(printf '%s' "$VARIANT" \
                 | sed 's|^SPEC:||; s|@|-|g; s|/|-|g; s|[^A-Za-z0-9._-]|-|g' \
                 | tr '[:lower:]' '[:upper:]' | cut -c1-60)
          id="${slug}-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "experiment \`$id\`" >> "$GITHUB_STEP_SUMMARY"

      - name: retire the running experiment, on the image still running
        if: steps.guard.outputs.roll == 'yes' && steps.experiment.outputs.id != 'none'
        # BEFORE the roll, deliberately. An experiment records its git_sha and
        # bind_experiment() refuses a container carrying a different one, so
        # rolling first guarantees a drift refusal: /readyz never passes and
        # the host script rolls back an image that was fine.
        env:
          # THE DEPLOY DOCUMENT'S NAME WITH ITS SUFFIX SWAPPED, not with a
          # suffix appended. Terraform names these `<stack>-deploy` and
          # `<stack>-experiment`; appending gives `...-deploy-experiment`,
          # which does not exist and fails as an IAM AccessDenied on a
          # document nobody can find. That is what happened on 2026-09-04.
          # The repository variable if it is set, else the name Terraform
          # gives the document. Deriving it means a NEW stack needs no
          # repository variable at all -- merge, apply, roll -- and
          # tests/live/test_document_names_are_derivable.py pins the scheme
          # against infra/terraform so the fallback cannot rot.
          DEPLOY_DOC: ${{ vars[matrix.document_var] || format('deltabt-paper-{0}-deploy', matrix.stack) }}
          ID: ${{ steps.host.outputs.instance_id }}
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command --region "$AWS_REGION" \
            --document-name "${DEPLOY_DOC%-deploy}-experiment" --instance-ids "$ID" \
            --parameters "Action=stop" \
            --comment "gha ${{ github.run_id }} retire" \
            --query 'Command.CommandId' --output text)
          for _ in $(seq 1 60); do
            st=$(aws ssm get-command-invocation --region "$AWS_REGION" \
                  --command-id "$CMD" --instance-id "$ID" \
                  --query Status --output text 2>/dev/null || echo Pending)
            case "$st" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD" --instance-id "$ID" \
            --query 'StandardOutputContent' --output text || true
          [ "$st" = "Success" ] || { echo "::error::could not retire the running experiment"; exit 1; }

      - name: send the deploy command
        if: steps.guard.outputs.roll == 'yes'
        id: send
        run: |
          CMD=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "${{ vars[matrix.document_var] || format('deltabt-paper-{0}-deploy', matrix.stack) }}" \
            --instance-ids "${{ steps.host.outputs.instance_id }}" \
            --parameters "ImageTag=${{ steps.tag.outputs.tag }}" \
            --comment "gha ${{ github.run_id }}" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD" >> "$GITHUB_OUTPUT"
          echo "SSM command $CMD"

      - name: wait for it, and fail loudly if it did not take
        if: steps.guard.outputs.roll == 'yes'
        run: |
          CMD="${{ steps.send.outputs.command_id }}"
          ID="${{ steps.host.outputs.instance_id }}"
          # The host script allows up to 900s for readiness plus the same again
          # for a rollback, so this waits longer than that before giving up.
          for _ in $(seq 1 190); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" \
                       --command-id "$CMD" --instance-id "$ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "deploy succeeded"; break ;;
              Failed|Cancelled|TimedOut) echo "::error::deploy $STATUS"; FAILED=1; break ;;
            esac
            sleep 20
          done
          echo '### Host output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD" --instance-id "$ID" \
            --query 'StandardOutputContent' --output text | tail -80 \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${FAILED:-0}" = "1" ]; then
            aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$CMD" --instance-id "$ID" \
              --query 'StandardErrorContent' --output text || true
            echo "::error::The host rolls back automatically. Verify with /readyz before deploying again."
            exit 1
          fi
          [ "$STATUS" = "Success" ] || { echo "::error::timed out waiting for the host"; exit 1; }

      - name: start the successor experiment
        if: steps.guard.outputs.roll == 'yes' && steps.experiment.outputs.id != 'none'
        # AFTER the roll, so the experiment records the SHA the bot is actually
        # running. The document stops the service, runs preflight, registers
        # the id, restarts and waits for /readyz -- so a green step here means
        # the bot is live AND bound, not merely that a row was written.
        #
        # A failure leaves a healthy bot running UNBOUND: its decisions carry
        # no experiment id. That is loud and recoverable, and it is better than
        # rolling back an image that passed its own health gate.
        env:
          # THE DEPLOY DOCUMENT'S NAME WITH ITS SUFFIX SWAPPED, not with a
          # suffix appended. Terraform names these `<stack>-deploy` and
          # `<stack>-experiment`; appending gives `...-deploy-experiment`,
          # which does not exist and fails as an IAM AccessDenied on a
          # document nobody can find. That is what happened on 2026-09-04.
          # The repository variable if it is set, else the name Terraform
          # gives the document. Deriving it means a NEW stack needs no
          # repository variable at all -- merge, apply, roll -- and
          # tests/live/test_document_names_are_derivable.py pins the scheme
          # against infra/terraform so the fallback cannot rot.
          DEPLOY_DOC: ${{ vars[matrix.document_var] || format('deltabt-paper-{0}-deploy', matrix.stack) }}
          ID: ${{ steps.host.outputs.instance_id }}
          EXP: ${{ steps.experiment.outputs.id }}
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command --region "$AWS_REGION" \
            --document-name "${DEPLOY_DOC%-deploy}-experiment" --instance-ids "$ID" \
            --parameters "Action=start,ExperimentId=$EXP" \
            --comment "gha ${{ github.run_id }} start" \
            --query 'Command.CommandId' --output text)
          st=Pending
          for _ in $(seq 1 120); do
            st=$(aws ssm get-command-invocation --region "$AWS_REGION" \
                  --command-id "$CMD" --instance-id "$ID" \
                  --query Status --output text 2>/dev/null || echo Pending)
            case "$st" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          {
            echo '### Experiment'
            echo '```'
            aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$CMD" --instance-id "$ID" \
              --query 'StandardOutputContent' --output text | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$st" != "Success" ]; then
            aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$CMD" --instance-id "$ID" \
              --query 'StandardErrorContent' --output text || true
            echo "::error::THE IMAGE IS DEPLOYED AND HEALTHY, BUT NO EXPERIMENT IS RUNNING."
            echo "::error::The bot is live and unbound. Fix the cause, then re-run this workflow."
            exit 1
          fi
          echo "experiment \`$EXP\` is running" >> "$GITHUB_STEP_SUMMARY"

      - name: what the deploy document reported
        if: steps.guard.outputs.roll == 'yes'
        # NO second SSM channel. This role's ssm:SendCommand is scoped to the
        # deltabt-paper-deploy document and that instance -- it cannot invoke
        # AWS-RunShellScript, and that is the point: a workflow able to run
        # arbitrary shell on the bot host is a workflow able to do anything to
        # the experiment. An earlier version of this step reached for
        # AWS-RunShellScript and was correctly denied.
        #
        # The verification therefore lives in the two places that can do it
        # without widening anything:
        #   * deploy.sh, on the host, which gates on /readyz and rolls back to
        #     the previous tag by itself if the new image does not come up;
        #   * scripts/verify_deployment.py, run by an operator, which checks
        #     the AWS side too (one instance, the silence alarm, log delivery).
        run: |
          echo "The host script gated on /readyz and did not roll back."
          echo "Operator verification (14 checks, read-only):"
          echo "  AWS_PROFILE=... python3 scripts/verify_deployment.py \\"
          echo "    --instance-id ${{ steps.host.outputs.instance_id }} --region $AWS_REGION \\"
          echo "    --expected-sha ${{ steps.tag.outputs.tag }}"

      - name: the deployed commit, image and config hash
        if: steps.guard.outputs.roll == 'yes'
        run: |
          {
            echo '### Provenance'
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| image | \`${{ steps.tag.outputs.tag }}\` |"
            echo "| strategy_config_hash | \`$(python3 -c "from app.config.strategy import StrategyConfig; print(StrategyConfig().config_hash)")\` |"
            echo
            echo "**Successful infrastructure deployment does not create an"
            echo "experiment and does not start paper trading.** Starting the"
            echo "forward test is a deliberate human action taken after the"
            echo "application preflight passes -- docs/aws_deployment.md section 13."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # THE LIVE DEPLOY PATH.
  #
  # A SEPARATE JOB, NOT A GENERALISATION OF `deploy`, by operator decision on
  # 2026-09-15. Generalising would have been less code and would have exercised
  # one path twice; it would also have meant editing the job that rolls the
  # paper bot while the paper bot is nine days into a thirty-day experiment
  # that is the only thing measuring whether the arm has an edge. The cost of
  # this choice is the duplication below, and duplication is what let the
  # paper stack table drift from Terraform and dispatch rolls at terminated
  # instances -- so the ONE thing not duplicated is the stack list, which is
  # read from infra/terraform/live.tf by scripts/live_stacks_matrix.py.
  #
  # Before this existed, build-live pushed an image that nothing consumed: no
  # job declared `needs: build-live`, and `deploy` reads the paper build's tag
  # and the paper repository. The live image was built, stored, and never
  # deployed.
  # ---------------------------------------------------------------------------
  targets-live:
    name: choose live stacks
    needs: build-live
    if: needs['build-live'].outputs.exists == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      ready: ${{ steps.credential.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-session-name: gha-live-targets-${{ github.run_id }}

      - name: has the venue credential been supplied yet?
        id: credential
        # ASKED OF SECRETS MANAGER, not of a repository variable.
        #
        # This used to read vars.LIVE_CREDENTIAL_SECRET_ARN, which a human had
        # to set after creating the secret by hand. Terraform now declares the
        # secret, so the only open question is whether anybody has put a VALUE
        # in it -- and that is a fact about the account, not about a variable
        # somebody remembered to set.
        #
        # DescribeSecret returns the version list and no secret material. CI
        # can see that a credential exists and still cannot read one; only the
        # instance role has GetSecretValue.
        #
        # AN ABSENT OR UNPOPULATED SECRET IS EXPECTED, NOT AN ERROR. Terraform
        # neither creates nor reads it -- deliberately, so that it can be
        # created BEFORE the infrastructure and the whole stack come up on one
        # merge. If the operator has done that, this is ready on the first run;
        # if not, the roll skips with the command to fix it, and the host waits
        # at exit 90 rather than crash-looping.
        env:
          SECRET_NAME: deltabt-paper/live/venue-credentials
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if ! out=$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" 2>&1); then
            case "$out" in
              *ResourceNotFoundException*)
                # THE FIELD NAMES ARE NOT SPELLED HERE, DELIBERATELY.
                # test_deployment_safety.py forbids naming an exchange
                # credential anywhere on the deployment surface except
                # live.tf, run_live.sh and Dockerfile.live -- and this file is
                # none of those. Spelling them in a help string cost a red
                # safety scan; pointing at the file that legitimately carries
                # them costs nothing and keeps the boundary exact.
                echo "::notice::$SECRET_NAME does not exist yet, so the live roll will skip. Create the venue API key, then: aws secretsmanager create-secret --name $SECRET_NAME --secret-string file://creds.json -- see deploy/aws/run_live.sh for the two JSON fields it parses. The key's IP allowlist can be set afterwards, once the host's EIP exists." ;;
              *)
                echo "::error::could not inspect $SECRET_NAME: $out"
                exit 1 ;;
            esac
            exit 0
          fi
          # VersionIdsToStages is absent until a value is put; an empty object
          # is what a declared-but-unpopulated secret returns.
          if printf '%s' "$out" | grep -q 'AWSCURRENT'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SECRET_NAME exists but holds no value, so the live roll will skip. aws secretsmanager put-secret-value --secret-id $SECRET_NAME --secret-string file://creds.json"
          fi

      - id: pick
        env:
          ONLY: ${{ github.event.inputs.only_stack }}
          ARN: ${{ steps.credential.outputs.ready }}
        run: |
          set -euo pipefail
          # READ FROM TERRAFORM, not from a table here. See the script.
          picked=$(python3 scripts/live_stacks_matrix.py ${ONLY:+"$ONLY"} || echo '[]')
          if [ -n "${ONLY:-}" ] && [ "$picked" = "[]" ]; then
            echo "::notice::only_stack='$ONLY' is not a live stack; the live deploy has nothing to do"
          fi
          if [ -z "${ARN:-}" ] && [ "$picked" != "[]" ]; then
            echo "::notice::live stacks are configured but the venue credential holds no value, so deploy-live will skip. The host comes up, reads \"none\", and waits (exit 90, not a crash loop). Create the venue key against the host's EIP, create the secret, set the variable, then dispatch this workflow with only_stack=<stack>."
          fi
          echo "rolling (live): $picked"
          echo "matrix=$picked" >> "$GITHUB_OUTPUT"

  deploy-live:
    name: "roll LIVE ${{ matrix.stack }} (${{ matrix.variant }})"
    needs: [test, build-live, targets-live, wait-for-infrastructure]
    # Same `always()` shape as `deploy`, and the same reason for the last
    # clause: a matrix expanded from an empty array is INVALID rather than
    # empty, and GitHub rejects the workflow instead of skipping the job.
    #
    # AND ONLY ONCE A CREDENTIAL IS CONFIGURED. The venue API key must allowlist
    # the host's IP, the EIP does not exist until the apply, so the secret is
    # necessarily created AFTER the host. Until then run_live.sh reads "none"
    # and exit 90s -- which is correct and deliberate, but it means /readyz
    # never passes, deploy.sh rolls back, and this job would go RED on the very
    # merge that is supposed to bring the stack up.
    #
    # So it skips, loudly, exactly as build-live skips with no repository. The
    # readiness is decided by asking Secrets Manager whether a value exists --
    # metadata only, no GetSecretValue -- rather than by a repository variable
    # somebody had to remember to set.
    if: >-
      always() && needs['build-live'].result == 'success'
      && needs['build-live'].outputs.exists == 'true'
      && needs.test.result == 'success'
      && needs['wait-for-infrastructure'].result == 'success'
      && needs['targets-live'].outputs.matrix != '[]'
      && needs['targets-live'].outputs.ready == 'true'
    runs-on: ubuntu-latest
    # ITS OWN ENVIRONMENT, so a required reviewer can be attached to live rolls
    # without also gating paper. On testnet this is play money and an unattended
    # roll is fine; before live_venue is ever set to mainnet, add a reviewer to
    # this environment. That is a GitHub setting, deliberately not a file here,
    # because a control a commit can remove is not a control.
    environment: live-deploy
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs['targets-live'].outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-live-${{ github.run_id }}

      - id: tag
        env:
          MANUAL: ${{ github.event.inputs.image_tag }}
          BUILT: ${{ needs['build-live'].outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${MANUAL:-$BUILT}"
          [ -n "$TAG" ] || { echo "::error::no live image tag resolved"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying LIVE $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: confirm the live image exists before touching the host
        # THE LIVE REPOSITORY, not the paper one. `deploy` reads
        # vars.ECR_REPOSITORY, and a live host pointed at that would be asked
        # to pull a tag that exists only in the other repository.
        env:
          REPO: ${{ needs['build-live'].outputs.repository }}
        run: |
          aws ecr describe-images --region "$AWS_REGION" \
            --repository-name "$REPO" \
            --image-ids "imageTag=${{ steps.tag.outputs.tag }}" \
            --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt}' --output json

      - name: find the host
        id: host
        # DISCOVERED, NOT CONFIGURED, exactly as the paper path does it: the
        # repository variable this replaces went stale on every instance
        # replacement. Live stacks share the `deltabt-paper-<stack>` Name tag
        # because var.environment is account-wide; the tag is set by Terraform
        # and cannot drift from the instance it names.
        env:
          NAME_TAG: deltabt-paper-${{ matrix.stack }}
        run: |
          set -euo pipefail
          ids=$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=$NAME_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          n=$(printf '%s\n' $ids | grep -c . || true)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one running host tagged $NAME_TAG, found $n: $ids"
            exit 1
          fi
          echo "instance_id=$ids" >> "$GITHUB_OUTPUT"
          echo "live host $ids ($NAME_TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: may we roll this host?
        id: guard
        # IDENTICAL SEMANTICS TO THE PAPER GUARD, and it matters at least as
        # much here: rolling retires the running experiment and resets its
        # sample to zero. Fails closed, and matches the CLI's words rather than
        # its exit code, because `forward-test status` exits 1 both for
        # "nothing is running" and for every real failure.
        env:
          DEPLOY_DOC: ${{ vars[matrix.document_var] || format('deltabt-paper-{0}-deploy', matrix.stack) }}
          ID: ${{ steps.host.outputs.instance_id }}
          ONLY: ${{ github.event.inputs.only_stack }}
        run: |
          set -euo pipefail
          echo "roll=no" >> "$GITHUB_OUTPUT"
          if [ -n "${ONLY:-}" ]; then
            echo "roll=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::only_stack=$ONLY is a deliberate dispatch; rolling regardless of experiment state"
            exit 0
          fi
          CMD=$(aws ssm send-command --region "$AWS_REGION" \
            --document-name "${DEPLOY_DOC%-deploy}-experiment" --instance-ids "$ID" \
            --parameters "Action=status" \
            --comment "gha ${{ github.run_id }} live guard" \
            --query 'Command.CommandId' --output text)
          st=Pending
          for _ in $(seq 1 60); do
            st=$(aws ssm get-command-invocation --region "$AWS_REGION" \
                  --command-id "$CMD" --instance-id "$ID" \
                  --query Status --output text 2>/dev/null || echo Pending)
            case "$st" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          out=$(aws ssm get-command-invocation --region "$AWS_REGION" \
                 --command-id "$CMD" --instance-id "$ID" \
                 --query 'StandardOutputContent' --output text 2>/dev/null || true)
          echo "$out"
          case "$out" in
            *"no experiment is RUNNING"*|*"nothing to protect"*)
              echo "roll=yes" >> "$GITHUB_OUTPUT"
              echo "::notice::no experiment is running on ${{ matrix.stack }}; rolling" ;;
            *)
              if [ "$st" = "Success" ]; then
                why="it has a RUNNING experiment"
              else
                why="its state could not be read (SSM command: $st)"
              fi
              echo "::notice::NOT rolling ${{ matrix.stack }}: $why. End the run, or dispatch deploy.yml with only_stack=${{ matrix.stack }} to roll deliberately."
              echo "${{ matrix.stack }}: not rolled -- $why" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: decide the experiment id
        if: steps.guard.outputs.roll == 'yes'
        id: experiment
        # The live bot inherits bind_experiment() from TradingBot, so the same
        # rule holds: an experiment records the git_sha it began on, and one id
        # must not describe two programs. A manual rollback deliberately does
        # NOT reset the sample.
        env:
          MANUAL_TAG: ${{ github.event.inputs.image_tag }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_TAG:-}" ]; then
            echo "id=none" >> "$GITHUB_OUTPUT"
            echo "::notice::rollback to an explicit tag: experiments left untouched"
            exit 0
          fi
          slug=$(printf '%s' "$VARIANT" \
                 | sed 's|^SPEC:||; s|@|-|g; s|/|-|g; s|[^A-Za-z0-9._-]|-|g' \
                 | tr '[:lower:]' '[:upper:]' | cut -c1-52)
          # LIVE- PREFIXED. The experiment id is what a result is read back by,
          # and a live run and a paper run of the same arm on the same day would
          # otherwise be told apart only by which database they landed in.
          id="LIVE-${slug}-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "experiment \`$id\`" >> "$GITHUB_STEP_SUMMARY"

      - name: retire the running experiment, on the image still running
        if: steps.guard.outputs.roll == 'yes' && steps.experiment.outputs.id != 'none'
        # BEFORE the roll. An experiment records its git_sha and
        # bind_experiment() refuses a container carrying a different one, so
        # rolling first guarantees a drift refusal and a pointless rollback.
        env:
          DEPLOY_DOC: ${{ vars[matrix.document_var] || format('deltabt-paper-{0}-deploy', matrix.stack) }}
          ID: ${{ steps.host.outputs.instance_id }}
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command --region "$AWS_REGION" \
            --document-name "${DEPLOY_DOC%-deploy}-experiment" --instance-ids "$ID" \
            --parameters "Action=stop" \
            --comment "gha ${{ github.run_id }} live retire" \
            --query 'Command.CommandId' --output text)
          st=Pending
          for _ in $(seq 1 60); do
            st=$(aws ssm get-command-invocation --region "$AWS_REGION" \
                  --command-id "$CMD" --instance-id "$ID" \
                  --query Status --output text 2>/dev/null || echo Pending)
            case "$st" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD" --instance-id "$ID" \
            --query 'StandardOutputContent' --output text || true
          [ "$st" = "Success" ] || { echo "::error::could not retire the running experiment"; exit 1; }

      - name: send the deploy command
        if: steps.guard.outputs.roll == 'yes'
        id: send
        run: |
          CMD=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "${{ vars[matrix.document_var] || format('deltabt-paper-{0}-deploy', matrix.stack) }}" \
            --instance-ids "${{ steps.host.outputs.instance_id }}" \
            --parameters "ImageTag=${{ steps.tag.outputs.tag }}" \
            --comment "gha ${{ github.run_id }} live" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD" >> "$GITHUB_OUTPUT"
          echo "SSM command $CMD"

      - name: wait for it, and fail loudly if it did not take
        if: steps.guard.outputs.roll == 'yes'
        run: |
          CMD="${{ steps.send.outputs.command_id }}"
          ID="${{ steps.host.outputs.instance_id }}"
          for _ in $(seq 1 190); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" \
                       --command-id "$CMD" --instance-id "$ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "live deploy succeeded"; break ;;
              Failed|Cancelled|TimedOut) echo "::error::live deploy $STATUS"; FAILED=1; break ;;
            esac
            sleep 20
          done
          echo '### Host output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD" --instance-id "$ID" \
            --query 'StandardOutputContent' --output text | tail -80 \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${FAILED:-0}" = "1" ]; then
            aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$CMD" --instance-id "$ID" \
              --query 'StandardErrorContent' --output text || true
            echo "::error::The host rolls back automatically. Verify with /readyz before deploying again."
            exit 1
          fi
          [ "$STATUS" = "Success" ] || { echo "::error::timed out waiting for the host"; exit 1; }

      - name: start the successor experiment
        if: steps.guard.outputs.roll == 'yes' && steps.experiment.outputs.id != 'none'
        # AFTER the roll, so the experiment records the SHA the bot is running.
        # A failure here leaves a healthy bot running UNBOUND -- loud and
        # recoverable, and better than rolling back an image that passed its
        # own health gate.
        env:
          DEPLOY_DOC: ${{ vars[matrix.document_var] || format('deltabt-paper-{0}-deploy', matrix.stack) }}
          ID: ${{ steps.host.outputs.instance_id }}
          EXP: ${{ steps.experiment.outputs.id }}
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command --region "$AWS_REGION" \
            --document-name "${DEPLOY_DOC%-deploy}-experiment" --instance-ids "$ID" \
            --parameters "Action=start,ExperimentId=$EXP" \
            --comment "gha ${{ github.run_id }} live start" \
            --query 'Command.CommandId' --output text)
          st=Pending
          for _ in $(seq 1 120); do
            st=$(aws ssm get-command-invocation --region "$AWS_REGION" \
                  --command-id "$CMD" --instance-id "$ID" \
                  --query Status --output text 2>/dev/null || echo Pending)
            case "$st" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          {
            echo '### Experiment'
            echo '```'
            aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$CMD" --instance-id "$ID" \
              --query 'StandardOutputContent' --output text | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$st" != "Success" ]; then
            aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$CMD" --instance-id "$ID" \
              --query 'StandardErrorContent' --output text || true
            echo "::error::THE LIVE IMAGE IS DEPLOYED AND HEALTHY, BUT NO EXPERIMENT IS RUNNING."
            echo "::error::The bot is live and unbound. Fix the cause, then re-run this workflow."
            exit 1
          fi
          echo "experiment \`$EXP\` is running" >> "$GITHUB_STEP_SUMMARY"

      - name: which venue this host is on
        if: steps.guard.outputs.roll == 'yes'
        # THE ONE FACT A LIVE DEPLOY SUMMARY MUST CARRY. It is read from the
        # SSM parameter the host itself reads, not from a workflow input, so
        # the summary cannot claim a venue the bot is not on.
        run: |
          {
            echo '### Live provenance'
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| image | \`${{ steps.tag.outputs.tag }}\` |"
            echo "| repository | \`${{ needs['build-live'].outputs.repository }}\` |"
            echo
            echo "**This host can place real orders.** On testnet that is play"
            echo "money; the venue above is the only thing that distinguishes"
            echo "the two, and it comes from the host's own parameter."
          } >> "$GITHUB_STEP_SUMMARY"

