name: deploy

# LIFECYCLE STAGE 3 of 3: APPLICATION.
#
# Build the image, push it to ECR, and roll the bot onto it. This workflow
# cannot change infrastructure -- its role can push to one ECR repository and
# invoke one SSM document, and that is all. Terraform is not run here.
#
# Deployment goes through SSM Run Command. There is no SSH path: no key pair
# exists in this stack, and the security group has no inbound rule to use one
# with.
#
# It does not start paper trading. Nothing does, automatically.
#
# The image tag is ALWAYS the git SHA. Never `latest`. A forward test whose
# results cannot be tied to an exact commit is not a forward test, and the
# image tag is the only durable link between a row in the database and the
# code that produced it.

on:
  push:
    branches: [master]
    # DEPLOYS ARE NOT FREE, AND THIS FILTER IS NOT TIDINESS.
    #
    # The experiment identity includes git_sha, so bind_experiment() refuses to
    # start when the container's SHA differs from the one the RUNNING forward
    # test recorded. /readyz never passes, deploy.sh rolls the host back, and
    # the job goes red. The only way to make a deploy SUCCEED is to stop the
    # experiment, deploy, and start a new experiment id -- which ends the run
    # and resets the sample to zero.
    #
    # So a commit that reaches this workflow without changing the image costs
    # two container restarts, two warm-up gaps in a live experiment, and a red
    # run, to ship nothing. 2026-08-18: fb69f7e added a 9,787-line research CSV
    # and all three roll jobs failed on drift, leaving V3's experiment stopped
    # as collateral. 2026-08-20: scripts/ and then tests/ did the same thing
    # twice in one day.
    #
    # A commit touching BOTH a matching and a non-matching path still deploys,
    # which is correct -- if any of the image changed, the image changed.
    #
    # AN ALLOW-LIST, BECAUSE THE DENY-LIST KEPT BEING WRONG.
    #
    # The rule has always been "is it in the image", but it was expressed as a
    # list of things that are NOT, which is unbounded: every directory nobody
    # thought of defaults to triggering a roll. On 2026-08-20 that cost two
    # red deploys and four container restarts in a live experiment -- first
    # scripts/, then tests/, neither of which the Dockerfile copies. Each fix
    # patched one hole in a surface with no edge.
    #
    # Inverted, the list has an edge, and it is the Dockerfile. deploy/docker/
    # is included because changing HOW the image is built changes the image as
    # surely as changing what goes into it.
    #
    # README.md is copied into the image and deliberately left out: it changes
    # nothing the container does, and rolling a live experiment to ship a
    # paragraph is the behaviour this whole block exists to prevent.
    #
    # tests/test_paths_match_dockerfile.py fails if a COPY line appears here
    # without a matching entry, so the next person to add one to the image is
    # told rather than left to discover it as a stale git_sha weeks later.
    paths:
      - 'app/**'
      - 'deltabt/**'
      # Offline analysis drivers. They ship, since deltabt/ is copied whole,
      # but nothing under app/ imports a run_*.py. Five were added in a single
      # day of research and each one rolled the bot.
      - '!deltabt/research/run_*.py'
      - 'deploy/docker/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing tag to roll back to. Leave empty to build this commit."
        required: false
        type: string
      only_stack:
        description: >-
          Roll ONE stack instead of all of them. Blank rolls every stack.
          A push cannot use this, so bringing a new arm up without disturbing
          an established one means dispatching manually: a push-triggered
          deploy rolls every stack, and any stack with a RUNNING experiment
          refuses the new SHA on drift, rolls itself back and goes red.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  # One deploy at a time. Two concurrent SSM deploys would fight over the same
  # systemd unit and the rollback tag.
  group: deploy-paper
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  test:
    # The whole suite, including the paper-only AST scan, on the exact commit
    # being shipped. Nothing reaches the host without it.
    uses: ./.github/workflows/test.yml

  targets:
    # WHICH STACKS TO ROLL, DECIDED BEFORE THE MATRIX EXISTS.
    #
    # only_stack cannot be applied in the deploy job's `if`: the matrix context
    # is not available there -- available contexts for jobs.<id>.if are github,
    # needs, vars and inputs, and nothing else. Referencing matrix.stack there
    # does not evaluate false, it makes the whole WORKFLOW invalid, and GitHub
    # rejects it before creating a single job. Learned by doing it.
    #
    # So the filter runs where the list is still data. Emitting JSON that the
    # deploy job expands with fromJSON is the supported way to vary a matrix,
    # and it keeps the stack table in one place.
    name: choose stacks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          ONLY: ${{ github.event.inputs.only_stack }}
        run: |
          set -euo pipefail
          # THIS TABLE IS A SECOND COPY OF THE TERRAFORM STACKS MAP, AND IT
          # DRIFTED. v3 and v4 were removed from infra/terraform/variables.tf
          # on 2026-08-25 and their hosts terminated, but this line still named
          # them -- so the merge that added v5 dispatched a roll at two
          # instance ids that no longer exist, and `only_stack=v5` would have
          # been rejected as matching no stack.
          #
          # Nothing here can detect that on its own: the deploy role can read
          # one ECR repository and invoke one SSM document, so it cannot query
          # Terraform state or describe instances to derive this list. The
          # table stays hand-written, which means adding or removing a stack is
          # THREE edits -- variables.tf, here, and monitor.yml -- plus the two
          # repository variables the new entry names.
          all='[{"stack":"atr","variant":"ATR","instance_var":"BOT_INSTANCE_ID_ATR","document_var":"SSM_DEPLOY_DOCUMENT_ATR"}]'
          if [ -n "${ONLY:-}" ]; then
            picked=$(printf '%s' "$all" | jq -c --arg s "$ONLY" '[.[] | select(.stack==$s)]')
            if [ "$picked" = "[]" ]; then
              echo "::error::only_stack='$ONLY' matches no stack; nothing would roll"
              exit 1
            fi
          else
            picked=$(printf '%s' "$all" | jq -c '.')
          fi
          echo "rolling: $picked"
          echo "matrix=$picked" >> "$GITHUB_OUTPUT"

  build:
    name: build and push
    needs: test
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: refuse to rebuild an existing tag
        # ECR is configured with IMMUTABLE tags, so a push would fail anyway.
        # Failing here makes the reason obvious instead of surfacing as an
        # opaque registry error.
        run: |
          if aws ecr describe-images --repository-name "${{ vars.ECR_REPOSITORY || 'deltabt' }}" \
               --image-ids "imageTag=${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "::notice::${{ steps.meta.outputs.tag }} is already in ECR; skipping the build."
            echo "already_built=true" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-qemu-action@v3
        if: env.already_built != 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.already_built != 'true'

      - name: build for arm64 and push
        if: env.already_built != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          # The host is Graviton. Building the same architecture it runs on is
          # also what makes the numba kernels baked at build time usable.
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY || 'deltabt' }}:${{ steps.meta.outputs.tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_DIRTY=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: "roll ${{ matrix.stack }} (${{ matrix.variant }})"
    needs: [test, build, targets]
    # `always()` so a manual rollback (which skips `build`) still runs, but the
    # build must not have FAILED.
    if: always() && needs.build.result != 'failure' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    # `paper-deploy`, NOT `paper`. Branch-restricted to master, but no required
    # reviewer -- and the distinction is the point.
    #
    # `paper` still gates the Terraform apply, which can destroy instances and
    # has no rollback. On 2026-08-19 a plan with NO configuration change wanted
    # to replace all three bots because Amazon published a new AMI; unattended,
    # that ends three experiments and nobody sees it coming. That gate stays.
    #
    # A bad DEPLOY already fails safe without a human: bind_experiment raises
    # ConfigurationDrift and refuses to run, deploy.sh rolls back when /readyz
    # does not pass, paths-ignore keeps infra and CI edits from triggering this
    # at all, and the AST scan blocks any order-placement code from shipping.
    # Worst case is a red build and a self-healing rollback -- noise, not
    # damage. An approval that only ever rubber-stamps is not a control.
    environment: paper-deploy
    # ONE JOB PER HOST, AND fail-fast IS OFF.
    #
    # The two hosts run different experiments against different databases. If
    # v1 refuses the image on configuration drift, that says nothing about v2,
    # and cancelling v2 mid-roll would leave it on neither the old image nor
    # the new one. Each rolls, verifies and rolls itself back independently.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag || needs.build.outputs.tag }}"
          [ -n "$TAG" ] || { echo "no image tag resolved"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: confirm the image exists before touching the host
        # NOT a full infrastructure preflight. This job authenticates as
        # deltabt-paper-github-app-deploy, which can push one ECR repository
        # and invoke one SSM document -- and nothing else. Asserting that IAM,
        # the state bucket and RDS are all well-formed would require read
        # access this role must not have, and widening it to satisfy a check
        # would dissolve the separation the check exists to protect.
        #
        # The infrastructure workflow runs `aws_preflight.py --phase
        # application` with the role that legitimately can, after every apply.
        run: |
          aws ecr describe-images --region "$AWS_REGION" \
            --repository-name "${{ vars.ECR_REPOSITORY || 'deltabt' }}" \
            --image-ids "imageTag=${{ steps.tag.outputs.tag }}" \
            --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt}' --output json

      - name: warn if a forward test is running
        # Not a hard block: a genuine bug fix during a run is sometimes
        # necessary. But it must be a conscious act, and the log must record
        # that the code changed underneath a running experiment -- otherwise
        # the results describe two different systems wearing one name.
        run: |
          echo "::warning::If a forward test is RUNNING, this changes the code underneath it."
          echo "::warning::Per docs/operations.md that means: stop the experiment, deploy, start a NEW experiment id."

      - name: send the deploy command
        id: send
        run: |
          CMD=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "${{ vars[matrix.document_var] }}" \
            --instance-ids "${{ vars[matrix.instance_var] }}" \
            --parameters "ImageTag=${{ steps.tag.outputs.tag }}" \
            --comment "gha ${{ github.run_id }}" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD" >> "$GITHUB_OUTPUT"
          echo "SSM command $CMD"

      - name: wait for it, and fail loudly if it did not take
        run: |
          CMD="${{ steps.send.outputs.command_id }}"
          ID="${{ vars[matrix.instance_var] }}"
          # The host script allows up to 900s for readiness plus the same again
          # for a rollback, so this waits longer than that before giving up.
          for _ in $(seq 1 190); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" \
                       --command-id "$CMD" --instance-id "$ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "deploy succeeded"; break ;;
              Failed|Cancelled|TimedOut) echo "::error::deploy $STATUS"; FAILED=1; break ;;
            esac
            sleep 20
          done
          echo '### Host output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "$CMD" --instance-id "$ID" \
            --query 'StandardOutputContent' --output text | tail -80 \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${FAILED:-0}" = "1" ]; then
            aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$CMD" --instance-id "$ID" \
              --query 'StandardErrorContent' --output text || true
            echo "::error::The host rolls back automatically. Verify with /readyz before deploying again."
            exit 1
          fi
          [ "$STATUS" = "Success" ] || { echo "::error::timed out waiting for the host"; exit 1; }

      - name: what the deploy document reported
        # NO second SSM channel. This role's ssm:SendCommand is scoped to the
        # deltabt-paper-deploy document and that instance -- it cannot invoke
        # AWS-RunShellScript, and that is the point: a workflow able to run
        # arbitrary shell on the bot host is a workflow able to do anything to
        # the experiment. An earlier version of this step reached for
        # AWS-RunShellScript and was correctly denied.
        #
        # The verification therefore lives in the two places that can do it
        # without widening anything:
        #   * deploy.sh, on the host, which gates on /readyz and rolls back to
        #     the previous tag by itself if the new image does not come up;
        #   * scripts/verify_deployment.py, run by an operator, which checks
        #     the AWS side too (one instance, the silence alarm, log delivery).
        run: |
          echo "The host script gated on /readyz and did not roll back."
          echo "Operator verification (14 checks, read-only):"
          echo "  AWS_PROFILE=... python3 scripts/verify_deployment.py \\"
          echo "    --instance-id ${{ vars[matrix.instance_var] }} --region $AWS_REGION \\"
          echo "    --expected-sha ${{ steps.tag.outputs.tag }}"

      - name: the deployed commit, image and config hash
        run: |
          {
            echo '### Provenance'
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| image | \`${{ steps.tag.outputs.tag }}\` |"
            echo "| strategy_config_hash | \`$(python3 -c "from app.config.strategy import StrategyConfig; print(StrategyConfig().config_hash)")\` |"
            echo
            echo "**Successful infrastructure deployment does not create an"
            echo "experiment and does not start paper trading.** Starting the"
            echo "forward test is a deliberate human action taken after the"
            echo "application preflight passes -- docs/aws_deployment.md section 13."
          } >> "$GITHUB_STEP_SUMMARY"
